[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jbroker-client"
version = "0.1.0"
description = "Minimal Python reference client for the j-broker gRPC wire protocol"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "grpcio>=1.66",
    "protobuf>=5.26",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.66",
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["jbroker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["jbroker/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
