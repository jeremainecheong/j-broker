<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="j-broker">
  <title>j-broker</title>
  <!-- Tight favicon: drop the log strip + labels; keep the 3-node topology silhouette so it reads at 16x16. -->
  <rect width="64" height="64" rx="12" fill="#f8fafc"/>

  <!-- Heartbeat links -->
  <line x1="32" y1="16" x2="14" y2="46" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 1.5"/>
  <line x1="32" y1="16" x2="50" y2="46" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 1.5"/>
  <line x1="14" y1="46" x2="50" y2="46" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="2 1.5"/>

  <!-- Controller (yellow) -->
  <circle cx="32" cy="16" r="9" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <!-- Followers (blue) -->
  <circle cx="14" cy="46" r="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="50" cy="46" r="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
</svg>
