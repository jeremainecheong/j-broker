name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

  perf-gate:
    # Runs @Tag("perf") tests with generous regression floors
    # so a merge that halves throughput or triples tail latency breaks
    # the build. Thresholds are set ~3-5x above observed dev-machine
    # numbers so we catch catastrophic regressions (VT pinning, missing
    # batching, serialisation blowup) without going red on GitHub's
    # noisy-neighbour IO.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run perf gate — end-to-end produce+consume
        env:
          JBROKER_RUN_PERF: '1'
        run: ./gradlew :integration-tests:test --tests "jbroker.it.PerfGateIT" --no-daemon

      - name: Run perf gate — log append throughput
        env:
          JBROKER_RUN_PERF: '1'
        run: ./gradlew :broker-storage:test --tests "jbroker.storage.AppendThroughputTest" --no-daemon

      - name: Upload perf reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-reports
          path: '**/build/reports/tests/'

  proto-compat:
    # Rolling upgrades mean old and new brokers speak the same RPCs
    # mid-deploy, and client jars lag broker releases. buf compares this
    # PR's protos against the base branch and fails on wire-breaking
    # edits — field retypes, deletes without reserving the number.
    # Rule set lives in buf.yaml (WIRE_JSON).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # buf reads the base branch straight out of .git, so the
          # remote-tracking ref has to exist in the clone.
          fetch-depth: 0

      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          version: 1.72.0
          setup_only: true

      - name: Check wire compatibility against base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: buf breaking --against ".git#branch=origin/${BASE_REF},subdir=proto/src/main/proto"

  helm-kind:
    # Secured install on a real (Kind) cluster: mTLS from a Secret,
    # auth.mode=mtls with ACL default-deny, admin login required. Proves
    # the chart + certs + secrets actually deploy, not just template.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -f Dockerfile.broker -t jbroker-broker:ci .
          docker build -f Dockerfile.admin  -t jbroker-admin:ci .

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: jbroker-ci

      - name: Load images into Kind
        run: |
          kind load docker-image jbroker-broker:ci --name jbroker-ci
          kind load docker-image jbroker-admin:ci --name jbroker-ci

      - name: Create TLS + operator secrets
        run: |
          scripts/tls/bootstrap-k8s.sh .tls-k8s jb-j-broker-broker-headless default
          kubectl create secret generic jbroker-tls \
            --from-file=tls.crt=.tls-k8s/server.crt \
            --from-file=tls.key=.tls-k8s/server.key \
            --from-file=ca.crt=.tls-k8s/ca.crt
          HASH=$(docker run --rm httpd:2.4-alpine htpasswd -bnBC 10 "" ci-password | tr -d ':\n')
          kubectl create secret generic jbroker-admin-users \
            --from-literal=users="op:${HASH}"

      - name: Install secured release
        run: |
          helm install jb deploy/helm/j-broker \
            --set broker.image.repository=jbroker-broker \
            --set broker.image.tag=ci \
            --set broker.image.pullPolicy=Never \
            --set admin.image.repository=jbroker-admin \
            --set admin.image.tag=ci \
            --set admin.image.pullPolicy=Never \
            --set broker.persistence.enabled=false \
            --set broker.resources.requests.cpu=100m \
            --set broker.resources.requests.memory=256Mi \
            --set broker.resources.limits.cpu=1000m \
            --set broker.resources.limits.memory=1Gi \
            --set tls.enabled=true \
            --set broker.auth.mode=mtls \
            --set admin.auth.existingSecret=jbroker-admin-users
          kubectl rollout status statefulset/jb-j-broker-broker --timeout=300s
          kubectl rollout status deployment/jb-j-broker-admin --timeout=300s

      - name: Smoke — login required, session reaches a healthy cluster over mTLS
        run: |
          kubectl port-forward svc/jb-j-broker-admin 15672:15672 &
          sleep 5
          anon=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:15672/api/v1/cluster)
          [ "$anon" = "401" ] || { echo "anonymous API expected 401, got $anon"; exit 1; }
          curl -s -o /dev/null -c /tmp/session.jar \
            --data-urlencode 'username=op' --data-urlencode 'password=ci-password' \
            http://localhost:15672/login
          body=$(curl -s -b /tmp/session.jar http://localhost:15672/api/v1/cluster)
          echo "$body" | grep -q '"nodes"' || { echo "cluster summary missing nodes: $body"; exit 1; }
          alive=$(echo "$body" | grep -o '"alive":true' | wc -l)
          [ "$alive" -eq 3 ] || { echo "expected 3 alive brokers, got $alive: $body"; exit 1; }

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl describe pods || true
          kubectl logs -l app.kubernetes.io/component=broker --tail=200 --prefix || true
          kubectl logs -l app.kubernetes.io/component=admin --tail=200 --prefix || true

  python-client:
    # Proves the wire protocol is language-neutral: the Python reference
    # client (stubs generated from the same protos, batch codec written
    # against the same byte layout) runs its unit tests plus a full
    # produce/group-consume/commit E2E — including a cross-language batch
    # round trip — against the real broker binary.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml

      - name: Build broker distribution
        run: ./gradlew :broker-app:installDist --no-daemon

      - name: Install client and generate stubs
        working-directory: clients/python
        run: |
          pip install -e '.[dev]'
          ./generate.sh

      - name: Lint and format gate
        working-directory: clients/python
        run: |
          ruff check .
          ruff format --check .

      - name: Run pytest
        working-directory: clients/python
        run: pytest -v
