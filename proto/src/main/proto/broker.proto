syntax = "proto3";
package jbroker.broker;
import "common.proto";
option java_multiple_files = true;
option java_package = "jbroker.proto.broker";

service Producer {
  rpc Produce(ProduceRequest) returns (ProduceResponse);
  // Assigns a unique (producer_id, producer_epoch) pair to a client. The
  // controller persists the next-id counter through Raft so it survives a
  // restart. Added in Phase 6.7 (idempotent producer).
  rpc InitProducerId(InitProducerIdRequest) returns (InitProducerIdResponse);
}

service Consumer {
  rpc Fetch(FetchRequest) returns (FetchResponse);
  // Phase 7 — consumer groups. The first cut of these RPCs (P7.1) wires the
  // surface; subsequent slices (P7.3..P7.7) implement the bodies. Until
  // implemented, handlers return COORDINATOR_NOT_AVAILABLE / OFFSET_OUT_OF_RANGE.
  rpc ListOffsets(ListOffsetsRequest) returns (ListOffsetsResponse);
  rpc FindCoordinator(FindCoordinatorRequest) returns (FindCoordinatorResponse);
  rpc ConsumerGroupHeartbeat(ConsumerGroupHeartbeatRequest)
      returns (ConsumerGroupHeartbeatResponse);
  rpc CommitOffsets(CommitOffsetsRequest) returns (CommitOffsetsResponse);
  rpc FetchOffsets(FetchOffsetsRequest) returns (FetchOffsetsResponse);
}

// Broker-internal RPC used by followers to pull committed record batches
// from the partition leader. Distinct from Consumer.Fetch (client-facing).
service ReplicaConsumer {
  rpc ReplicaFetch(ReplicaFetchRequest) returns (ReplicaFetchResponse);
  // Follower reconciliation (P6.4): after a FENCED_EPOCH on ReplicaFetch,
  // the follower asks the leader for the end offset of its last-seen
  // leader_epoch so it can truncate any divergent suffix before resuming.
  rpc OffsetsForLeaderEpoch(OffsetsForLeaderEpochRequest) returns (OffsetsForLeaderEpochResponse);
}

service Admin {
  rpc CreateTopic(CreateTopicRequest) returns (CreateTopicResponse);
  rpc ListTopics(ListTopicsRequest) returns (ListTopicsResponse);
  rpc DescribeTopic(DescribeTopicRequest) returns (DescribeTopicResponse);
  // Phase 8 — topic CRUD.
  rpc DeleteTopic(DeleteTopicRequest) returns (DeleteTopicResponse);
  rpc UpdateTopicConfig(UpdateTopicConfigRequest) returns (UpdateTopicConfigResponse);
  // P12.7 — consumer-group mutations. Both route to the coordinator
  // broker; NOT_COORDINATOR hints the admin-app at which broker to retry.
  rpc DeleteConsumerGroup(DeleteConsumerGroupRequest) returns (DeleteConsumerGroupResponse);
  rpc ResetConsumerGroupOffsets(ResetConsumerGroupOffsetsRequest) returns (ResetConsumerGroupOffsetsResponse);
}

// Phase 8 — read-only admin observability surface. All RPCs answer from
// whichever broker receives the request (metadata is replicated); the
// admin-app fans out when it needs cluster-wide aggregation. Handlers
// land in later P8 slices; P8.1 wires the surface and leaves every RPC
// returning ErrorCode.UNIMPLEMENTED until its owning slice replaces it.
service Metadata {
  rpc DescribeCluster(DescribeClusterRequest) returns (DescribeClusterResponse);
  rpc DescribeTopicPartitions(DescribeTopicPartitionsRequest)
      returns (DescribeTopicPartitionsResponse);
  rpc ListConsumerGroups(ListConsumerGroupsRequest) returns (ListConsumerGroupsResponse);
  rpc DescribeConsumerGroup(DescribeConsumerGroupRequest)
      returns (DescribeConsumerGroupResponse);
  rpc DescribeRaft(DescribeRaftRequest) returns (DescribeRaftResponse);
  // P8.5 — rolling throughput + latency snapshot for the admin metrics UI.
  rpc DescribeMetrics(DescribeMetricsRequest) returns (DescribeMetricsResponse);
  // P8.6 — server streams broker-side events (leader changes, broker
  // registrations, group rebalances, ...). Client bootstraps with
  // {@code after_id=0} to start at the stream head; reconnects pass the
  // last id they observed so the server replays anything newer that's
  // still in the in-process ring buffer.
  rpc SubscribeEvents(SubscribeEventsRequest) returns (stream EventMessage);
}

// Broker-to-broker cluster management RPCs. P6.5.b adds BrokerHeartbeat
// so each broker advertises its liveness directly to every peer; the
// active controller (P6.5.c) uses the aggregated view to fence
// unresponsive brokers from partition leadership.
//
// Heartbeats deliberately bypass the Raft log: the design spec's
// BrokerHeartbeatRecord approach was blocked by the "follower propose
// silently dropped" constraint observed in P6.5.a. Point-to-point RPCs
// match real KRaft's broker-heartbeat protocol and are the spec's
// explicit perf-tuning fallback.
service Cluster {
  rpc BrokerHeartbeat(BrokerHeartbeatRequest) returns (BrokerHeartbeatResponse);
}

message BrokerHeartbeatRequest {
  int32 broker_id = 1;
  int64 current_metadata_offset = 2;
}

message BrokerHeartbeatResponse {
  Error error = 1;
}

// ===== Produce =====

message ProduceRequest {
  string topic = 1;
  int32 partition = 2;
  // Raw Kafka v2 record-batch bytes, prepared by the client.
  bytes batch = 3;
  // Phase 6.7 idempotent-producer fields. Clients that haven't called
  // InitProducerId leave these at their defaults (producer_id = -1,
  // producer_epoch = 0, base_sequence = -1) and the leader skips dedup.
  int64 producer_id = 4;
  int32 producer_epoch = 5;
  int32 base_sequence = 6;
  // Phase 6.6 durability gate. Kafka semantics:
  //   0 / 1 (or proto3 default = 0): leader appends locally and returns
  //     without waiting for followers. Subject to loss on leader failure.
  //   -1: wait for the HWM to advance past the produced last-offset,
  //     i.e. every ISR member has replicated the record. Rejected with
  //     NOT_ENOUGH_REPLICAS if the wait times out.
  int32 acks = 7;
}

message ProduceResponse {
  int64 base_offset = 1;
  int64 last_offset = 2;
  Error error = 3;
}

// ===== Fetch =====

message FetchRequest {
  string topic = 1;
  int32 partition = 2;
  int64 offset = 3;
  int32 max_bytes = 4;
  // P7.11 incremental fetch sessions. Clients bootstrap with session_id=0;
  // the broker allocates a fresh session id and echoes it in the response.
  // On subsequent calls the client sends the returned session_id (with an
  // ever-incrementing session_epoch) so the broker can cache per-(topic,
  // partition) state across calls. The pair is optional — omitting both is
  // equivalent to a legacy stateless fetch.
  int32 session_id = 5;
  int32 session_epoch = 6;
}

message FetchResponse {
  // Raw bytes containing one or more v2 record batches; may be empty if the
  // offset is at or past the log end.
  bytes records = 1;
  int64 high_watermark = 2;
  Error error = 3;
  // Echoes (for session_id>0 requests) or allocates (for session_id=0) the
  // session id the client should send on its next Fetch.
  int32 session_id = 4;
}

// ===== ReplicaFetch (follower -> leader) =====

message ReplicaFetchRequest {
  string topic = 1;
  int32 partition = 2;
  int32 follower_broker_id = 3;
  // Epoch the follower believes to be current. The leader rejects with
  // FENCED_EPOCH if it doesn't match so the follower can reconcile via
  // OffsetsForLeaderEpoch (P6.4) before retrying.
  int32 leader_epoch = 4;
  int64 fetch_offset = 5;
  int32 max_bytes = 6;
}

message ReplicaFetchResponse {
  bytes records = 1;
  int64 high_watermark = 2;
  // The leader's current view of the partition's leader_epoch so the
  // follower can detect its own staleness.
  int32 current_leader_epoch = 3;
  Error error = 4;
}

// ===== OffsetsForLeaderEpoch (follower -> leader, P6.4) =====

message OffsetsForLeaderEpochRequest {
  string topic = 1;
  int32 partition = 2;
  // The leader_epoch the follower last observed. The leader answers
  // with the endOffset of that epoch (the startOffset of the next
  // recorded epoch, or current LEO if this is the latest epoch).
  int32 leader_epoch = 3;
}

message OffsetsForLeaderEpochResponse {
  int64 end_offset = 1;
  Error error = 2;
}

// ===== InitProducerId =====

message InitProducerIdRequest {
  // Reserved for future transactional-id use; empty in Phase 6.7 (plain
  // idempotent producer only). Field left in place so the wire shape
  // matches the PRD §8.4 sketch from day one.
  string transactional_id = 1;
}

message InitProducerIdResponse {
  Error error = 1;
  int64 producer_id = 2;
  // Producer epoch is an int32 on the wire (proto3 lacks int16). Valid
  // range is [0, 65535]; consumers that need to feed this to the v2 batch
  // header cast it to int16.
  int32 producer_epoch = 3;
}

// ===== Admin =====

message CreateTopicRequest {
  string topic = 1;
  int32 partitions = 2;
  int32 replication_factor = 3;
  // Phase 8 — opaque topic config map. Broker round-trips; enforcement
  // arrives in Phase 9 (retention, compaction). Empty map is fine.
  map<string, string> config = 4;
}

message CreateTopicResponse {
  Error error = 1;
}

message DeleteTopicRequest {
  string topic = 1;
}

message DeleteTopicResponse {
  Error error = 1;
}

message UpdateTopicConfigRequest {
  string topic = 1;
  map<string, string> config = 2;
}

message UpdateTopicConfigResponse {
  Error error = 1;
  map<string, string> config = 2; // merged effective config after apply
}

// P12.7 — consumer-group mutations.
message DeleteConsumerGroupRequest {
  string group_id = 1;
}

message DeleteConsumerGroupResponse {
  jbroker.common.ErrorCode error = 1;
  // When error == NOT_COORDINATOR, points at the broker that owns the
  // group's __consumer_offsets partition so the admin-app can retry.
  int32 suggested_coordinator_id = 2;
  string suggested_coordinator_host = 3;
  int32 suggested_coordinator_port = 4;
}

message OffsetReset {
  jbroker.common.TopicPartition tp = 1;
  int64 offset = 2; // target committed offset
  int32 leader_epoch = 3;
}

message ResetConsumerGroupOffsetsRequest {
  string group_id = 1;
  repeated OffsetReset resets = 2;
}

message OffsetResetResult {
  jbroker.common.TopicPartition tp = 1;
  jbroker.common.ErrorCode error = 2;
}

message ResetConsumerGroupOffsetsResponse {
  jbroker.common.ErrorCode error = 1;
  repeated OffsetResetResult results = 2;
  int32 suggested_coordinator_id = 3;
  string suggested_coordinator_host = 4;
  int32 suggested_coordinator_port = 5;
}

message ListTopicsRequest {}

message ListTopicsResponse {
  repeated TopicDescription topics = 1;
}

message DescribeTopicRequest {
  string topic = 1;
}

message DescribeTopicResponse {
  TopicDescription topic = 1;
  Error error = 2;
}

message TopicDescription {
  string topic = 1;
  int32 partitions = 2;
  int32 replication_factor = 3;
  int64 created_millis = 4;
  // Phase 8 — surfaced on ListTopics + DescribeTopic so the admin UI can
  // render internal vs user topics differently.
  bool internal = 5;
  bool compact = 6;
  map<string, string> config = 7;
}

message Error {
  int32 code = 1;
  string message = 2;
  // Phase 8 — optional flat key/value hints. Admin REST layer surfaces
  // these into the {@code hint} object of the PRD §8.7 error envelope.
  // Common keys:
  //   suggested_leader_id   (int32, decimal)
  //   suggested_leader_host (string)
  //   suggested_leader_port (int32, decimal)
  map<string, string> hint = 3;
}

// ===== Consumer-group RPCs (Phase 7) =====
//
// Wire shape mirrors PRD §8.5 with two minor adaptations:
// 1. Co-located here in broker.proto rather than a fork consumer.proto, so
//    BrokerClient can stay single-channel.
// 2. TopicPartition lives in common.proto (added in P7.1); reused across
//    the offset commit/fetch and assignment messages.

message ListOffsetsRequest {
  // -1 = consumer fetch (default); positive = follower-replica fetch.
  int32 replica_id = 1;
  repeated ListOffsetsPartition partitions = 2;
}

message ListOffsetsPartition {
  jbroker.common.TopicPartition tp = 1;
  // -1 = latest, -2 = earliest, else by-timestamp lookup.
  int64 timestamp = 2;
}

message ListOffsetsResponse {
  repeated ListOffsetsResult results = 1;
}

message ListOffsetsResult {
  jbroker.common.TopicPartition tp = 1;
  jbroker.common.ErrorCode error = 2;
  int64 timestamp = 3;
  int64 offset = 4;
  int32 leader_epoch = 5;
}

message FindCoordinatorRequest {
  // Always group_id in Phase 7. Reserved for transactional-id lookups later.
  string key = 1;
}

message FindCoordinatorResponse {
  jbroker.common.ErrorCode error = 1;
  jbroker.common.BrokerEndpoint coordinator = 2;
}

// One topic + a list of partition indices. Used inside Assignment and
// inside the heartbeat's owned_partitions echo. Defined in broker.proto so
// consumer-group payloads stay co-located.
message TopicPartitions {
  string topic = 1;
  repeated int32 partitions = 2;
}

message Assignment {
  repeated TopicPartitions assigned_partitions = 1;
}

message ConsumerGroupHeartbeatRequest {
  string group_id = 1;
  // Empty on the very first heartbeat; coordinator assigns one and echoes
  // it back. The client persists it for the rest of its lifetime.
  string member_id = 2;
  // 0 on join; -1 on leave; otherwise the last value the coordinator
  // returned (proves the client has acked the latest assignment).
  int32 member_epoch = 3;
  // For static membership: same instance_id across restarts keeps the
  // member's slot. Empty for dynamic members.
  string instance_id = 4;
  int32 rebalance_timeout_ms = 5;
  // Sent only when the subscription set changes (or on first heartbeat).
  repeated string subscribed_topics = 6;
  // Optional preference; coordinator picks a server-side assignor.
  string server_assignor = 7;
  // Echo of the partitions the member currently owns; lets the coordinator
  // confirm a revoke before rolling forward to the next assignment.
  repeated TopicPartitions owned_partitions = 8;
}

message ConsumerGroupHeartbeatResponse {
  jbroker.common.ErrorCode error = 1;
  int32 throttle_time_ms = 2;
  // Same as request on steady heartbeats; populated only when coordinator
  // assigned a fresh id (first heartbeat / static-rejoin).
  string member_id = 3;
  int32 member_epoch = 4;
  int32 heartbeat_interval_ms = 5;
  // Populated only when the assignment changed since the last heartbeat.
  Assignment assignment = 6;
}

message CommitOffsetsRequest {
  string group_id = 1;
  // The member's current member_epoch — coordinator rejects stale commits
  // with FENCED_MEMBER_EPOCH.
  int32 generation_id_or_member_epoch = 2;
  string member_id = 3;
  repeated OffsetCommit commits = 4;
}

message OffsetCommit {
  jbroker.common.TopicPartition tp = 1;
  int64 offset = 2;
  // The leader_epoch the consumer last fetched from. Stored alongside the
  // offset so a future log-truncation event can be detected on resume.
  int32 leader_epoch = 3;
  string metadata = 4;
}

message CommitOffsetsResponse {
  repeated CommitResult results = 1;
}

message CommitResult {
  jbroker.common.TopicPartition tp = 1;
  jbroker.common.ErrorCode error = 2;
}

message FetchOffsetsRequest {
  string group_id = 1;
  repeated jbroker.common.TopicPartition tps = 2;
}

message FetchOffsetsResponse {
  repeated OffsetFetchResult results = 1;
}

message OffsetFetchResult {
  jbroker.common.TopicPartition tp = 1;
  // -1 if no offset has ever been committed for (group, tp).
  int64 offset = 2;
  int32 leader_epoch = 3;
  string metadata = 4;
  jbroker.common.ErrorCode error = 5;
}

// ===== Metadata service (Phase 8) =====
//
// Read-only surface consumed by admin-app. Each RPC is answerable from
// any broker's local metadata replica (aggregation happens client-side
// when cluster-wide views are needed). P8.1 wires the surface and every
// handler returns ErrorCode.UNIMPLEMENTED; later slices fill bodies:
// P8.2 — DescribeCluster; P8.3 — DescribeTopicPartitions;
// P8.4 — ListConsumerGroups + DescribeConsumerGroup; P8.5 — DescribeRaft.

message DescribeClusterRequest {}

message DescribeClusterResponse {
  jbroker.common.ErrorCode error = 1;
  int32 controller_id = 2;
  int64 current_term = 3;
  int64 metadata_offset = 4;
  repeated BrokerInfo nodes = 5;
}

message BrokerInfo {
  int32 broker_id = 1;
  string host = 2;
  int32 port = 3;
  // LEADER | FOLLOWER | CANDIDATE | UNKNOWN (for peers whose role the
  // responding broker cannot observe directly).
  string role = 4;
  bool alive = 5;
  int64 last_seen_millis = 6;
}

message DescribeTopicPartitionsRequest {
  string topic = 1;
}

message DescribeTopicPartitionsResponse {
  jbroker.common.ErrorCode error = 1;
  string topic = 2;
  int32 partitions = 3;
  int32 replication_factor = 4;
  bool internal = 5;
  bool compact = 6;
  int64 created_millis = 7;
  map<string, string> config = 8;
  repeated PartitionStateInfo partition_states = 9;
}

message PartitionStateInfo {
  int32 partition = 1;
  int32 leader = 2;
  repeated int32 isr = 3;
  repeated int32 replicas = 4;
  int32 leader_epoch = 5;
  int32 partition_epoch = 6;
  // -1 sentinel means "ask the partition leader" — the responding broker
  // does not lead this partition, so it cannot report HWM / LEO locally.
  int64 high_watermark = 7;
  int64 log_end_offset = 8;
}

message ListConsumerGroupsRequest {}

message ListConsumerGroupsResponse {
  jbroker.common.ErrorCode error = 1;
  repeated ConsumerGroupSummary groups = 2;
}

message ConsumerGroupSummary {
  string group_id = 1;
  // e.g. "Stable" | "PreparingRebalance" | "Empty" (Phase 8 emits only
  // "Stable" | "Empty"; cooperative states are masked until needed).
  string state = 2;
  int32 member_count = 3;
  string assignor = 4;
  int32 generation = 5;
  // Partition in __consumer_offsets that owns this group. Useful for
  // admin-level diagnostics.
  int32 coordinator_partition = 6;
}

message DescribeConsumerGroupRequest {
  string group_id = 1;
}

message DescribeConsumerGroupResponse {
  jbroker.common.ErrorCode error = 1;
  string group_id = 2;
  int32 generation = 3;
  string state = 4;
  string assignor = 5;
  repeated MemberInfo members = 6;
  repeated PartitionLag partitions = 7;
}

message MemberInfo {
  string member_id = 1;
  string instance_id = 2;
  int32 member_epoch = 3;
  repeated TopicPartitions owned_partitions = 4;
  repeated string subscribed_topics = 5;
}

message PartitionLag {
  jbroker.common.TopicPartition tp = 1;
  int64 committed_offset = 2;
  int64 high_watermark = 3;
  // max(0, high_watermark - committed_offset). Emitted server-side so
  // the admin-app doesn't have to duplicate the clamp.
  int64 lag = 4;
  string owner_member_id = 5;
}

message DescribeRaftRequest {}

message DescribeRaftResponse {
  jbroker.common.ErrorCode error = 1;
  int32 node_id = 2;
  string role = 3;
  int64 current_term = 4;
  int64 commit_index = 5;
  int64 last_applied = 6;
  // -1 if not voted.
  int32 voted_for = 7;
  int64 last_log_index = 8;
  int64 last_log_term = 9;
}

message DescribeMetricsRequest {}

message SubscribeEventsRequest {
  // Events with id > after_id are streamed. 0 = start from stream head.
  int64 after_id = 1;
}

message EventMessage {
  // Monotonic per-broker id; the client echoes it as after_id on reconnect.
  int64 id = 1;
  // One of the {@code BrokerEvent} typeName() values: "leader_changed",
  // "isr_shrink" / "isr_expand", "raft_term_change", "broker_registered",
  // "broker_fenced", "consumer_group_rebalance".
  string type = 2;
  // JSON payload per PRD §8.8. Kept as a string so the SSE endpoint can
  // pass it through unchanged; admin-app does not parse it.
  string data_json = 3;
}

message DescribeMetricsResponse {
  jbroker.common.ErrorCode error = 1;
  int32 broker_id = 2;
  double window_seconds = 3;
  int64 produce_count = 4;
  int64 produce_bytes = 5;
  int64 fetch_count = 6;
  int64 fetch_bytes = 7;
  double produce_bytes_per_sec = 8;
  double fetch_bytes_per_sec = 9;
  int64 produce_p50_nanos = 10;
  int64 produce_p99_nanos = 11;
  int64 produce_p999_nanos = 12;
  int64 fetch_p50_nanos = 13;
  int64 fetch_p99_nanos = 14;
  int64 fetch_p999_nanos = 15;
  int64 incremental_fetch_hits = 16;
  // P9.1 — Raft observability snapshot. Leader reports accurate values;
  // followers report whatever their RaftCore knows (still correct, just
  // behind). Absent on brokers that aren't Raft voters.
  int64 raft_current_term = 17;
  int64 raft_commit_index = 18;
  int64 raft_last_applied = 19;
  int64 raft_last_log_index = 20;
  // P9.1 — per-partition metrics. Leader-hosted partitions only; the
  // leader is the only broker with complete ISR + HWM info. Follower
  // brokers omit partitions they don't lead.
  repeated PartitionMetrics partition_metrics = 21;
}

message PartitionMetrics {
  string topic = 1;
  int32 partition = 2;
  int32 isr_size = 3;
  // HWM computed via FollowerStateTracker.computeHwm — monotonic
  // min(LEO) across ISR. 0 when any ISR follower has never fetched.
  int64 hwm = 4;
  // Leader's local log end offset; used as the numerator when admin UI
  // displays replication lag.
  int64 leader_log_end_offset = 5;
  // Per-follower byte lag (leaderLEO - followerLEO) * approx-record-size.
  // Zero for the leader itself. Only includes brokers currently in ISR
  // or configured as replicas.
  map<int32, int64> replication_lag_by_follower = 6;
}
