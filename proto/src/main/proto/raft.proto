syntax = "proto3";
package jbroker.raft;
option java_multiple_files = true;
option java_package = "jbroker.proto.raft";

service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
  rpc TimeoutNow(TimeoutNowRequest) returns (TimeoutNowResponse);
}

enum EntryType {
  NORMAL = 0;
  NO_OP = 1;
  CONFIG_CHANGE = 2;
}

message LogEntry {
  int64 index = 1;
  int64 term = 2;
  EntryType type = 3;
  bytes payload = 4;
  int64 client_id = 5;
  int64 client_seq = 6;
}

message RequestVoteRequest {
  int64 term = 1;
  int32 candidate_id = 2;
  string candidate_directory_id = 3;
  int64 last_log_index = 4;
  int64 last_log_term = 5;
  bool pre_vote = 6;
}

message RequestVoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  int64 term = 1;
  int32 leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int64 leader_commit = 6;
  // Monotonic leader-side sequence; follower echoes in response so the
  // leader can distinguish responses to heartbeats sent after a ClientRead
  // registered (read-index barrier, Raft §6.4).
  int64 heartbeat_seq = 7;
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;
  int64 conflict_index = 3;
  int64 conflict_term = 4;
  int64 heartbeat_seq = 5;
}

message InstallSnapshotRequest {
  int64 term = 1;
  int32 leader_id = 2;
  int64 last_included_index = 3;
  int64 last_included_term = 4;
  int64 offset = 5;
  bytes data = 6;
  bool done = 7;
}

message InstallSnapshotResponse {
  int64 term = 1;
}

message TimeoutNowRequest {
  int64 term = 1;
  int32 leader_id = 2;
}
message TimeoutNowResponse {
  int64 term = 1;
}

// -------- Metadata records (replicated via Raft, applied to the broker's
// metadata state machine) --------

message TopicRecord {
  string topic = 1;
  int32 partitions = 2;
  int32 replication_factor = 3;
  int64 created_millis = 4;
}

message PartitionRecord {
  string topic = 1;
  int32 partition = 2;
  repeated int32 replicas = 3;
  int32 leader = 4;
}

message BrokerRegistrationRecord {
  int32 broker_id = 1;
  string host = 2;
  int32 port = 3;
}

// Emitted by the partition leader (via the controller's Raft log) whenever
// (leader, ISR, leader_epoch) changes for a partition. Applied to every
// broker's MetadataStateMachine. leader_epoch is strictly monotonic per
// partition; stale records are ignored by the state machine.
//
// Invariants:
//   - isr[0] MUST be the leader; the state machine rejects records where
//     leader is not isr[0]. Subsequent order within isr is not significant.
message PartitionChangeRecord {
  string topic = 1;
  int32 partition = 2;
  int32 leader = 3;
  repeated int32 isr = 4;
  int32 leader_epoch = 5;

  // 6: reserved for controller_epoch (Phase 6.5+).
  reserved 6;
}

// Atomic create-topic bundle: TopicRecord + the initial PartitionChangeRecord
// for every partition, all applied inside a single state-machine transition.
// Without this, topic creation would be split across N+1 Raft log entries and
// a crash between them could leave the topic catalogue without leader state
// for some partitions.
message CreateTopicRecord {
  TopicRecord topic = 1;
  repeated PartitionChangeRecord partition_changes = 2;
}

// Tagged union of metadata records; the Raft state machine tags payloads
// with this wrapper so it can dispatch.
message MetadataRecord {
  oneof kind {
    TopicRecord topic = 1;
    PartitionRecord partition = 2;
    BrokerRegistrationRecord broker = 3;
    PartitionChangeRecord partition_change = 4;
    CreateTopicRecord create_topic = 5;
  }
}
