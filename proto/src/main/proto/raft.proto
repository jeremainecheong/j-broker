syntax = "proto3";
package jbroker.raft;
option java_multiple_files = true;
option java_package = "jbroker.proto.raft";

service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
  rpc TimeoutNow(TimeoutNowRequest) returns (TimeoutNowResponse);
}

enum EntryType {
  NORMAL = 0;
  NO_OP = 1;
  CONFIG_CHANGE = 2;
}

message LogEntry {
  int64 index = 1;
  int64 term = 2;
  EntryType type = 3;
  bytes payload = 4;
  int64 client_id = 5;
  int64 client_seq = 6;
}

message RequestVoteRequest {
  int64 term = 1;
  int32 candidate_id = 2;
  string candidate_directory_id = 3;
  int64 last_log_index = 4;
  int64 last_log_term = 5;
  bool pre_vote = 6;
}

message RequestVoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  int64 term = 1;
  int32 leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int64 leader_commit = 6;
  // Monotonic leader-side sequence; follower echoes in response so the
  // leader can distinguish responses to heartbeats sent after a ClientRead
  // registered (read-index barrier, Raft §6.4).
  int64 heartbeat_seq = 7;
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;
  int64 conflict_index = 3;
  int64 conflict_term = 4;
  int64 heartbeat_seq = 5;
}

message InstallSnapshotRequest {
  int64 term = 1;
  int32 leader_id = 2;
  int64 last_included_index = 3;
  int64 last_included_term = 4;
  int64 offset = 5;
  bytes data = 6;
  bool done = 7;
}

message InstallSnapshotResponse {
  int64 term = 1;
}

message TimeoutNowRequest {
  int64 term = 1;
  int32 leader_id = 2;
}
message TimeoutNowResponse {
  int64 term = 1;
}
