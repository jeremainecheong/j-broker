syntax = "proto3";
package jbroker.common;
option java_multiple_files = true;
option java_package = "jbroker.proto.common";

enum ErrorCode {
  OK = 0;
  UNKNOWN = 1;
  UNSUPPORTED_VERSION = 50;
  STALE_LEADER_EPOCH = 70;
  FENCED_LEADER_EPOCH = 71;
  // Consumer groups
  COORDINATOR_NOT_AVAILABLE = 80;
  NOT_COORDINATOR = 81;
  UNKNOWN_MEMBER_ID = 82;
  FENCED_MEMBER_EPOCH = 83;
  OFFSET_OUT_OF_RANGE = 84;
  // Incremental fetch session was evicted from the server-side cache
  // (LRU full or broker restart). Client should reset session_id=0 and retry.
  FETCH_SESSION_ID_NOT_FOUND = 85;
  // Admin surface skeleton placeholder. An RPC whose body is not
  // yet wired (the proto surface is defined up front; request bodies are filled in incrementally).
  UNIMPLEMENTED = 99;
  // Admin tried to mutate a group the coordinator doesn't track
  // (never-joined or already deleted).
  UNKNOWN_GROUP = 86;
}

message BrokerEndpoint {
  int32 node_id = 1;
  string host = 2;
  int32 port = 3;
  string directory_id = 4;
}

// Identifier for a single partition of a topic. Used on
// consumer-group RPCs (offset commit/fetch, assignment).
message TopicPartition {
  string topic = 1;
  int32 partition = 2;
}
