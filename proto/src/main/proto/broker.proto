syntax = "proto3";
package jbroker.broker;
import "common.proto";
option java_multiple_files = true;
option java_package = "jbroker.proto.broker";

service Producer {
  rpc Produce(ProduceRequest) returns (ProduceResponse);
  // Assigns a unique (producer_id, producer_epoch) pair to a client. The
  // controller persists the next-id counter through Raft so it survives a
  // restart. Added in Phase 6.7 (idempotent producer).
  rpc InitProducerId(InitProducerIdRequest) returns (InitProducerIdResponse);
}

service Consumer {
  rpc Fetch(FetchRequest) returns (FetchResponse);
  // Phase 7 — consumer groups. The first cut of these RPCs (P7.1) wires the
  // surface; subsequent slices (P7.3..P7.7) implement the bodies. Until
  // implemented, handlers return COORDINATOR_NOT_AVAILABLE / OFFSET_OUT_OF_RANGE.
  rpc ListOffsets(ListOffsetsRequest) returns (ListOffsetsResponse);
  rpc FindCoordinator(FindCoordinatorRequest) returns (FindCoordinatorResponse);
  rpc ConsumerGroupHeartbeat(ConsumerGroupHeartbeatRequest)
      returns (ConsumerGroupHeartbeatResponse);
  rpc CommitOffsets(CommitOffsetsRequest) returns (CommitOffsetsResponse);
  rpc FetchOffsets(FetchOffsetsRequest) returns (FetchOffsetsResponse);
}

// Broker-internal RPC used by followers to pull committed record batches
// from the partition leader. Distinct from Consumer.Fetch (client-facing).
service ReplicaConsumer {
  rpc ReplicaFetch(ReplicaFetchRequest) returns (ReplicaFetchResponse);
  // Follower reconciliation (P6.4): after a FENCED_EPOCH on ReplicaFetch,
  // the follower asks the leader for the end offset of its last-seen
  // leader_epoch so it can truncate any divergent suffix before resuming.
  rpc OffsetsForLeaderEpoch(OffsetsForLeaderEpochRequest) returns (OffsetsForLeaderEpochResponse);
}

service Admin {
  rpc CreateTopic(CreateTopicRequest) returns (CreateTopicResponse);
  rpc ListTopics(ListTopicsRequest) returns (ListTopicsResponse);
  rpc DescribeTopic(DescribeTopicRequest) returns (DescribeTopicResponse);
}

// Broker-to-broker cluster management RPCs. P6.5.b adds BrokerHeartbeat
// so each broker advertises its liveness directly to every peer; the
// active controller (P6.5.c) uses the aggregated view to fence
// unresponsive brokers from partition leadership.
//
// Heartbeats deliberately bypass the Raft log: the design spec's
// BrokerHeartbeatRecord approach was blocked by the "follower propose
// silently dropped" constraint observed in P6.5.a. Point-to-point RPCs
// match real KRaft's broker-heartbeat protocol and are the spec's
// explicit perf-tuning fallback.
service Cluster {
  rpc BrokerHeartbeat(BrokerHeartbeatRequest) returns (BrokerHeartbeatResponse);
}

message BrokerHeartbeatRequest {
  int32 broker_id = 1;
  int64 current_metadata_offset = 2;
}

message BrokerHeartbeatResponse {
  Error error = 1;
}

// ===== Produce =====

message ProduceRequest {
  string topic = 1;
  int32 partition = 2;
  // Raw Kafka v2 record-batch bytes, prepared by the client.
  bytes batch = 3;
  // Phase 6.7 idempotent-producer fields. Clients that haven't called
  // InitProducerId leave these at their defaults (producer_id = -1,
  // producer_epoch = 0, base_sequence = -1) and the leader skips dedup.
  int64 producer_id = 4;
  int32 producer_epoch = 5;
  int32 base_sequence = 6;
  // Phase 6.6 durability gate. Kafka semantics:
  //   0 / 1 (or proto3 default = 0): leader appends locally and returns
  //     without waiting for followers. Subject to loss on leader failure.
  //   -1: wait for the HWM to advance past the produced last-offset,
  //     i.e. every ISR member has replicated the record. Rejected with
  //     NOT_ENOUGH_REPLICAS if the wait times out.
  int32 acks = 7;
}

message ProduceResponse {
  int64 base_offset = 1;
  int64 last_offset = 2;
  Error error = 3;
}

// ===== Fetch =====

message FetchRequest {
  string topic = 1;
  int32 partition = 2;
  int64 offset = 3;
  int32 max_bytes = 4;
}

message FetchResponse {
  // Raw bytes containing one or more v2 record batches; may be empty if the
  // offset is at or past the log end.
  bytes records = 1;
  int64 high_watermark = 2;
  Error error = 3;
}

// ===== ReplicaFetch (follower -> leader) =====

message ReplicaFetchRequest {
  string topic = 1;
  int32 partition = 2;
  int32 follower_broker_id = 3;
  // Epoch the follower believes to be current. The leader rejects with
  // FENCED_EPOCH if it doesn't match so the follower can reconcile via
  // OffsetsForLeaderEpoch (P6.4) before retrying.
  int32 leader_epoch = 4;
  int64 fetch_offset = 5;
  int32 max_bytes = 6;
}

message ReplicaFetchResponse {
  bytes records = 1;
  int64 high_watermark = 2;
  // The leader's current view of the partition's leader_epoch so the
  // follower can detect its own staleness.
  int32 current_leader_epoch = 3;
  Error error = 4;
}

// ===== OffsetsForLeaderEpoch (follower -> leader, P6.4) =====

message OffsetsForLeaderEpochRequest {
  string topic = 1;
  int32 partition = 2;
  // The leader_epoch the follower last observed. The leader answers
  // with the endOffset of that epoch (the startOffset of the next
  // recorded epoch, or current LEO if this is the latest epoch).
  int32 leader_epoch = 3;
}

message OffsetsForLeaderEpochResponse {
  int64 end_offset = 1;
  Error error = 2;
}

// ===== InitProducerId =====

message InitProducerIdRequest {
  // Reserved for future transactional-id use; empty in Phase 6.7 (plain
  // idempotent producer only). Field left in place so the wire shape
  // matches the PRD §8.4 sketch from day one.
  string transactional_id = 1;
}

message InitProducerIdResponse {
  Error error = 1;
  int64 producer_id = 2;
  // Producer epoch is an int32 on the wire (proto3 lacks int16). Valid
  // range is [0, 65535]; consumers that need to feed this to the v2 batch
  // header cast it to int16.
  int32 producer_epoch = 3;
}

// ===== Admin =====

message CreateTopicRequest {
  string topic = 1;
  int32 partitions = 2;
  int32 replication_factor = 3;
}

message CreateTopicResponse {
  Error error = 1;
}

message ListTopicsRequest {}

message ListTopicsResponse {
  repeated TopicDescription topics = 1;
}

message DescribeTopicRequest {
  string topic = 1;
}

message DescribeTopicResponse {
  TopicDescription topic = 1;
  Error error = 2;
}

message TopicDescription {
  string topic = 1;
  int32 partitions = 2;
  int32 replication_factor = 3;
  int64 created_millis = 4;
}

message Error {
  int32 code = 1;
  string message = 2;
}

// ===== Consumer-group RPCs (Phase 7) =====
//
// Wire shape mirrors PRD §8.5 with two minor adaptations:
// 1. Co-located here in broker.proto rather than a fork consumer.proto, so
//    BrokerClient can stay single-channel.
// 2. TopicPartition lives in common.proto (added in P7.1); reused across
//    the offset commit/fetch and assignment messages.

message ListOffsetsRequest {
  // -1 = consumer fetch (default); positive = follower-replica fetch.
  int32 replica_id = 1;
  repeated ListOffsetsPartition partitions = 2;
}

message ListOffsetsPartition {
  jbroker.common.TopicPartition tp = 1;
  // -1 = latest, -2 = earliest, else by-timestamp lookup.
  int64 timestamp = 2;
}

message ListOffsetsResponse {
  repeated ListOffsetsResult results = 1;
}

message ListOffsetsResult {
  jbroker.common.TopicPartition tp = 1;
  jbroker.common.ErrorCode error = 2;
  int64 timestamp = 3;
  int64 offset = 4;
  int32 leader_epoch = 5;
}

message FindCoordinatorRequest {
  // Always group_id in Phase 7. Reserved for transactional-id lookups later.
  string key = 1;
}

message FindCoordinatorResponse {
  jbroker.common.ErrorCode error = 1;
  jbroker.common.BrokerEndpoint coordinator = 2;
}

// One topic + a list of partition indices. Used inside Assignment and
// inside the heartbeat's owned_partitions echo. Defined in broker.proto so
// consumer-group payloads stay co-located.
message TopicPartitions {
  string topic = 1;
  repeated int32 partitions = 2;
}

message Assignment {
  repeated TopicPartitions assigned_partitions = 1;
}

message ConsumerGroupHeartbeatRequest {
  string group_id = 1;
  // Empty on the very first heartbeat; coordinator assigns one and echoes
  // it back. The client persists it for the rest of its lifetime.
  string member_id = 2;
  // 0 on join; -1 on leave; otherwise the last value the coordinator
  // returned (proves the client has acked the latest assignment).
  int32 member_epoch = 3;
  // For static membership: same instance_id across restarts keeps the
  // member's slot. Empty for dynamic members.
  string instance_id = 4;
  int32 rebalance_timeout_ms = 5;
  // Sent only when the subscription set changes (or on first heartbeat).
  repeated string subscribed_topics = 6;
  // Optional preference; coordinator picks a server-side assignor.
  string server_assignor = 7;
  // Echo of the partitions the member currently owns; lets the coordinator
  // confirm a revoke before rolling forward to the next assignment.
  repeated TopicPartitions owned_partitions = 8;
}

message ConsumerGroupHeartbeatResponse {
  jbroker.common.ErrorCode error = 1;
  int32 throttle_time_ms = 2;
  // Same as request on steady heartbeats; populated only when coordinator
  // assigned a fresh id (first heartbeat / static-rejoin).
  string member_id = 3;
  int32 member_epoch = 4;
  int32 heartbeat_interval_ms = 5;
  // Populated only when the assignment changed since the last heartbeat.
  Assignment assignment = 6;
}

message CommitOffsetsRequest {
  string group_id = 1;
  // The member's current member_epoch — coordinator rejects stale commits
  // with FENCED_MEMBER_EPOCH.
  int32 generation_id_or_member_epoch = 2;
  string member_id = 3;
  repeated OffsetCommit commits = 4;
}

message OffsetCommit {
  jbroker.common.TopicPartition tp = 1;
  int64 offset = 2;
  // The leader_epoch the consumer last fetched from. Stored alongside the
  // offset so a future log-truncation event can be detected on resume.
  int32 leader_epoch = 3;
  string metadata = 4;
}

message CommitOffsetsResponse {
  repeated CommitResult results = 1;
}

message CommitResult {
  jbroker.common.TopicPartition tp = 1;
  jbroker.common.ErrorCode error = 2;
}

message FetchOffsetsRequest {
  string group_id = 1;
  repeated jbroker.common.TopicPartition tps = 2;
}

message FetchOffsetsResponse {
  repeated OffsetFetchResult results = 1;
}

message OffsetFetchResult {
  jbroker.common.TopicPartition tp = 1;
  // -1 if no offset has ever been committed for (group, tp).
  int64 offset = 2;
  int32 leader_epoch = 3;
  string metadata = 4;
  jbroker.common.ErrorCode error = 5;
}
