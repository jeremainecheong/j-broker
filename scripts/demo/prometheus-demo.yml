# Prometheus scrape config for the full demo (scripts/demo/full-demo.sh).
# The compose admin-app publishes /actuator/prometheus on host port 15672;
# host.docker.internal resolves to the host from inside the Prometheus
# container (extra_hosts host-gateway covers Linux).
global:
  scrape_interval: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: jbroker-admin
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:15672"]
