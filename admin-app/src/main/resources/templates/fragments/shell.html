<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:fragment="head (title)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title}">j-broker admin</title>
    <link rel="stylesheet" th:href="@{/app.css}" />
    <!--
      self-host htmx + Alpine.js.
      Previously loaded from unpkg.com which (a) fails in networks that
      block outbound CDN traffic and (b) Chrome ORB was blocking the
      response due to unpkg returning a permissive-but-off content-type
      for some cross-origin clients. Self-hosted copies match the pinned
      versions; refresh via the LICENSES note under static/vendor/.
    -->
    <script th:src="@{/vendor/htmx-1.9.12.min.js}"></script>
    <script defer th:src="@{/vendor/alpine-3.13.5.min.js}"></script>
    <script defer th:src="@{/app.js}"></script>
    <!--
      Relative-time renderer. Rewrites <time data-epoch="…"> elements
      into "3s ago / 2m ago / 1h ago" labels on DOMContentLoaded. Loaded
      via the shell so every page gets it without per-template wiring.
    -->
    <script defer th:src="@{/epoch.js}"></script>
  </head>
  <body>
    <!--
      shared top-nav fragment. Every page inherits:
        * brand
        * route links (highlight via app.js based on window.location.pathname)
        * live cluster-health badge (htmx polls /api/v1/health/badge every 5s)
    -->
    <nav class="topnav" th:fragment="topnav">
      <span class="brand">j-broker</span>
      <a href="/" data-nav>Cluster</a>
      <a href="/topics" data-nav>Topics</a>
      <a href="/groups" data-nav>Groups</a>
      <a href="/raft" data-nav>Raft</a>
      <a href="/metrics" data-nav>Metrics</a>
      <a href="/chaos" data-nav>Chaos</a>
      <span class="spacer"></span>
      <!--
        The badge fragment below replaces itself on every response, so
        hx-swap="outerHTML" + the same outer wrapper means the pill keeps
        its title/colour even while the in-flight request resolves.
      -->
      <span
        id="cluster-health-badge"
        class="health-badge loading"
        hx-get="/ui/health/badge"
        hx-trigger="load, every 5s"
        hx-swap="outerHTML"
        hx-target="this"
        title="Cluster health — updates every 5s"
      >
        checking…
      </span>
    </nav>

    <!--
      badge-response fragment. The /api/v1/health/badge endpoint
      returns JSON by default, so we expose a tiny Thymeleaf fragment that
      the UI re-renders into the nav on each htmx tick. Wire via a
      @GetMapping(produces = "text/html") in a dedicated view controller so
      the JSON route stays machine-readable.
    -->
    <span
      th:fragment="badge (badge)"
      id="cluster-health-badge"
      th:classappend="${badge.status()}"
      class="health-badge"
      th:attr="title=${badge.reason()}"
      hx-get="/ui/health/badge"
      hx-trigger="every 5s"
      hx-swap="outerHTML"
      hx-target="this"
      th:text="${badge.status()}"
    >
      green
    </span>

    <!--
      Shared page footer. Single source of truth so we don't drift between
      stale "Milestone 8" labels and current version strings across templates.
      Keep this static — templating the version from Gradle is a bigger
      lift and adds zero user value.
    -->
    <footer th:fragment="footer">j-broker admin</footer>
  </body>
</html>
