syntax = "proto3";
package jbroker.raft;
option java_multiple_files = true;
option java_package = "jbroker.proto.raft";

service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
  rpc TimeoutNow(TimeoutNowRequest) returns (TimeoutNowResponse);
}

enum EntryType {
  NORMAL = 0;
  NO_OP = 1;
  CONFIG_CHANGE = 2;
}

message LogEntry {
  int64 index = 1;
  int64 term = 2;
  EntryType type = 3;
  bytes payload = 4;
  int64 client_id = 5;
  int64 client_seq = 6;
}

message RequestVoteRequest {
  int64 term = 1;
  int32 candidate_id = 2;
  string candidate_directory_id = 3;
  int64 last_log_index = 4;
  int64 last_log_term = 5;
  bool pre_vote = 6;
}

message RequestVoteResponse {
  int64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  int64 term = 1;
  int32 leader_id = 2;
  int64 prev_log_index = 3;
  int64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int64 leader_commit = 6;
  // Monotonic leader-side sequence; follower echoes in response so the
  // leader can distinguish responses to heartbeats sent after a ClientRead
  // registered (read-index barrier, Raft §6.4).
  int64 heartbeat_seq = 7;
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;
  int64 conflict_index = 3;
  int64 conflict_term = 4;
  int64 heartbeat_seq = 5;
}

message InstallSnapshotRequest {
  int64 term = 1;
  int32 leader_id = 2;
  int64 last_included_index = 3;
  int64 last_included_term = 4;
  int64 offset = 5;
  bytes data = 6;
  bool done = 7;
}

message InstallSnapshotResponse {
  int64 term = 1;
}

message TimeoutNowRequest {
  int64 term = 1;
  int32 leader_id = 2;
}
message TimeoutNowResponse {
  int64 term = 1;
}

// -------- Metadata records (replicated via Raft, applied to the broker's
// metadata state machine) --------

message TopicRecord {
  string topic = 1;
  int32 partitions = 2;
  int32 replication_factor = 3;
  int64 created_millis = 4;
  // Internal topics are hidden from {@code Admin.ListTopics} by
  // default (filtered by {@link TopicManager#list()}). __consumer_offsets
  // is the first internal topic; future ones (transactions, group state)
  // will share the flag.
  bool internal = 5;
  // Marker for read-time compaction (latest-record-per-key wins). On-disk
  // compaction enforcement is not yet implemented; this only flags topics
  // whose recovery scan should compact in memory.
  bool compact = 6;
  // Opaque topic configuration map. Broker does not read values
  // today; the admin API round-trips them unchanged so operators can see
  // what was configured. Enforcement (retention, compaction) is not yet implemented.
  map<string, string> config = 7;
}

message PartitionRecord {
  string topic = 1;
  int32 partition = 2;
  repeated int32 replicas = 3;
  int32 leader = 4;
}

message BrokerRegistrationRecord {
  int32 broker_id = 1;
  // Inter-broker address — what peer brokers dial for Raft, ReplicaFetch,
  // and Cluster heartbeat RPCs. Typically the service name in a container
  // deployment or the private-network IP on bare metal.
  string host = 2;
  int32 port = 3;
  // Advertised address surfaced in FindCoordinator /
  // DescribeCluster replies so external clients can reach this broker
  // via its published port even when that differs from the inter-broker
  // bind address. When unset (empty string / 0), falls back to host/port
  // — preserves single-network behavior for deployments that don't set it.
  string advertised_host = 4;
  int32 advertised_port = 5;
}

// Emitted by the partition leader (via the controller's Raft log) whenever
// (leader, ISR, leader_epoch) changes for a partition. Applied to every
// broker's MetadataStateMachine. leader_epoch is strictly monotonic per
// partition; stale records are ignored by the state machine.
//
// Invariants:
//   - isr[0] MUST be the leader; the state machine rejects records where
//     leader is not isr[0]. Subsequent order within isr is not significant.
message PartitionChangeRecord {
  string topic = 1;
  int32 partition = 2;
  int32 leader = 3;
  repeated int32 isr = 4;
  // Bumps only on leader change. Followers use it to trigger log
  // truncation via OffsetsForLeaderEpoch.
  int32 leader_epoch = 5;

  // 6: reserved for controller_epoch.
  reserved 6;

  // Full replica set for this partition — superset of isr. An out-of-ISR
  // replica still fetches so it can catch up and rejoin the ISR. Older
  // records leave this empty and the state machine defaults
  // replicas = isr for backward compatibility.
  repeated int32 replicas = 7;

  // Bumps on every ISR or replica-set change under the same leader_epoch;
  // resets to 0 on leader change. Exists so ISR flips don't look
  // like leadership changes to the OffsetsForLeaderEpoch reconciliation path.
  int32 partition_epoch = 8;

  // Compare-and-set guard. A proposal derived from partition state
  // (fencer demotions/recoveries, ISR flips, preferred-leader moves)
  // carries the epochs of the state it was derived FROM; apply drops the
  // record when the current state no longer matches, forcing the
  // proposer to re-derive from fresh state. Closes the stale-view window
  // where a freshly elected controller whose state-machine apply lags
  // its Raft log fences with an outdated ISR and promotes a shorter-log
  // replica (the #115 acked-record loss). Absent on legacy records and
  // on create-topic initial state (no prior state exists) — those keep
  // the plain accept-if-newer merge.
  optional int32 prior_leader_epoch = 9;
  optional int32 prior_partition_epoch = 10;
}

// Atomic create-topic bundle: TopicRecord + the initial PartitionChangeRecord
// for every partition, all applied inside a single state-machine transition.
// Without this, topic creation would be split across N+1 Raft log entries and
// a crash between them could leave the topic catalogue without leader state
// for some partitions.
message CreateTopicRecord {
  TopicRecord topic = 1;
  repeated PartitionChangeRecord partition_changes = 2;
}

// Emitted by the active controller when a client calls InitProducerId.
// Each record allocates exactly one producer_id; next_producer_id is the
// monotonic counter after this allocation (i.e. the id this record just
// assigned plus one). Applied by every broker's MetadataStateMachine so
// the counter survives restart and leader change.
message ProducerIdAssignmentRecord {
  int64 producer_id = 1;
  int32 producer_epoch = 2;
  int64 next_producer_id = 3;
}

// Deletes a topic cluster-wide. The state machine drops the
// topic + every PartitionState keyed on it; on-disk segment cleanup is
// best-effort via LogManager.deleteTopicDir.
message DeleteTopicRecord {
  string topic = 1;
}

// Merges a config map into an existing topic. Values are opaque
// strings today; the broker does not read them (enforcement is not yet implemented).
// Missing keys in the record leave the existing config value in place;
// passing an empty string value does NOT delete the key (use a future
// RemoveConfigRecord for that).
message UpdateTopicConfigRecord {
  string topic = 1;
  map<string, string> config = 2;
}

// Tagged union of metadata records; the Raft state machine tags payloads
// with this wrapper so it can dispatch.
message MetadataRecord {
  oneof kind {
    TopicRecord topic = 1;
    PartitionRecord partition = 2;
    BrokerRegistrationRecord broker = 3;
    PartitionChangeRecord partition_change = 4;
    CreateTopicRecord create_topic = 5;
    ProducerIdAssignmentRecord producer_id_assignment = 6;
    DeleteTopicRecord delete_topic = 7;
    UpdateTopicConfigRecord update_topic_config = 8;
  }
}
