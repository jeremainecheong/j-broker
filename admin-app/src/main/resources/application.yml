server:
  port: 9090
  servlet:
    session:
      # Cookie-only session tracking: never rewrite ;jsessionid into
      # URLs, where it would leak into logs and copied links.
      tracking-modes: cookie

spring:
  application:
    name: jbroker-admin
  jackson:
    # Every /api/v1/* response + request body uses snake_case. Affects
    # both serialization and deserialization, so form-style `CreateTopicBody`
    # JSON must arrive as {"replication_factor": N}. Java DTOs keep camelCase
    # accessors so Thymeleaf + server-internal code are unaffected.
    property-naming-strategy: SNAKE_CASE
  threads:
    virtual:
      # Virtual threads back SseEmitter fan-out and every controller's
      # gRPC fan-out across brokers. Spring Boot 3.2+ honours this flag.
      enabled: true

management:
  endpoints:
    web:
      exposure:
        # /actuator/prometheus serves cluster + admin-process metrics.
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

jbroker:
  admin:
    # Comma-separated list of broker host:port endpoints the admin-app
    # talks to. Overridable per environment.
    brokers: localhost:9092
    # MTLS to the broker gRPC surface. Enabled only when tls.enabled
    # is true AND cert/key/trust paths all resolve to PEM files. Default is
    # plaintext so existing Docker Compose deployments keep working unchanged.
    tls:
      enabled: false
      cert: ""
      key: ""
      trust: ""
  redis:
    # Empty (the default) → in-process SSE fan-out: no Redis connection is
    # attempted at any point and a single admin replica serves the event
    # stream entirely from its own ring buffer. Set to e.g.
    # "redis://localhost:6379" ONLY for multi-replica admin deployments —
    # Redis pub/sub is what carries events across replicas so every
    # browser sees every event regardless of which replica it is pinned to.
    url: ""
  metrics:
    scrape:
      # MetricsScraper cadence in seconds. Prometheus scrape
      # interval in prometheus.yml should be ≥ this value.
      intervalSeconds: 5
